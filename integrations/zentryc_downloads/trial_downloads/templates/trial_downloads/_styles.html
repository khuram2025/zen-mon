<style>
/* Trial download pages. Only what the site stylesheet does not already provide. */
.tdl-lede{font-size:1.05rem;color:var(--slate-600,#44566B);max-width:700px}
.tdl-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;padding:0;list-style:none;color:#BCCBDB;font-size:.95rem}
.tdl-facts+.hero-actions{margin-top:26px}
.tdl-facts li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand-300,#5EE6D0);margin-right:9px;vertical-align:middle}
.tdl-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:46px;align-items:start}
.tdl-panel{background:#fff;border:1px solid var(--line,#E4EAF1);border-radius:var(--radius,12px);padding:30px}
.tdl-panel h2{font-size:1.35rem;margin:0 0 6px}
.tdl-panel>p:first-of-type{margin-top:0}
.tdl-steps{counter-reset:tdl;display:grid;gap:18px;margin:22px 0 0;padding:0;list-style:none}
.tdl-steps li{counter-increment:tdl;position:relative;padding-left:46px;color:var(--slate-600,#44566B)}
.tdl-steps li::before{content:counter(tdl);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--brand-tint,#E7F7F3);color:var(--brand-800,#097061);font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.tdl-steps strong{display:block;color:var(--ink-text,#0B1A2D)}
.tdl-optional{font-weight:400;color:var(--slate-500,#647387)}
.tdl-help{font-size:.8rem;color:var(--slate-500,#647387);margin:6px 0 0}
.tdl-error{font-size:.84rem;font-weight:600;color:var(--err,#DC3545);margin:6px 0 0}
.tdl-invalid input,.tdl-invalid select{border-color:var(--err,#DC3545)!important;background:#fff}
.tdl-alert{border:1px solid #F3C2C7;background:#FDF1F2;color:#8A1C27;border-radius:var(--radius-sm,8px);padding:13px 16px;margin:0 0 20px;font-size:.93rem}
.tdl-alert a{color:inherit;text-decoration:underline}
.tdl-note{border:1px solid var(--brand-tint-2,#D6F0EA);background:var(--brand-tint,#E7F7F3);color:var(--slate-700,#28384A);border-radius:var(--radius-sm,8px);padding:14px 16px;font-size:.93rem}
.tdl-check{display:flex;gap:11px;align-items:flex-start;margin:0 0 12px;font-size:.9rem;color:var(--slate-600,#44566B);line-height:1.5}
.tdl-check input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--brand,#0FAE96)}
.tdl-trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tdl-file{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:22px 0;border-top:1px solid var(--line,#E4EAF1)}
.tdl-file:first-of-type{border-top:0;padding-top:6px}
.tdl-file h3{margin:0 0 4px;font-size:1.1rem}
.tdl-panel>.tdl-meta{margin:0 0 14px}
.tdl-file p{margin:0;font-size:.92rem}
.tdl-meta{color:var(--slate-500,#647387);font-size:.86rem}
.tdl-hash{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;color:var(--slate-500,#647387);overflow-wrap:anywhere;grid-column:1/-1}
.tdl-code{background:var(--ink,#0A1626);color:#E6F1FB;border-radius:var(--radius-sm,8px);padding:14px 16px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;overflow-x:auto;white-space:pre;margin:10px 0 16px}
.tdl-plain{margin:14px 0 0;padding-left:22px;color:var(--slate-600,#44566B);list-style:disc}
ol.tdl-plain{list-style:decimal}
.tdl-plain li{margin:9px 0}
.tdl-faq{max-width:820px;margin:0 auto}
.tdl-faq details{border-top:1px solid var(--line,#E4EAF1);padding:16px 0}
.tdl-faq details:last-child{border-bottom:1px solid var(--line,#E4EAF1)}
.tdl-faq summary{cursor:pointer;font-weight:700;color:var(--ink-text,#0B1A2D)}
.tdl-faq p{margin:10px 0 0;color:var(--slate-600,#44566B)}
.tdl-center{max-width:640px;margin:0 auto;text-align:center}
.tdl-center .tdl-panel{text-align:left;margin-top:28px}
.tdl-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.tdl-stack>*+*{margin-top:24px}
@media (max-width:900px){.tdl-grid{grid-template-columns:1fr;gap:30px}.tdl-grid>.form-card{order:-1}.tdl-file{grid-template-columns:1fr}}
</style>

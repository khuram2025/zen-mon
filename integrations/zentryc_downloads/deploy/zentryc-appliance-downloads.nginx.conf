# Appliance downloads behind the trial request form.
# Include in the zentryc.com server block, ABOVE the location that serves
# /downloads/zenplus-appliance/ today. Run `nginx -t` before reloading.
#
# CONFIRM ON THE HOST before use:
#   1. /home/net/appliance-releases/ below is a placeholder for the directory
#      that holds <version>/<file> today (see the existing appliance location).
#   2. The proxy lines in the last block must be the ones `location /` uses.

# Appliance images are never handed out by address. An old direct link, a
# bookmark or a link on another site lands on the request form.
location ~* ^/downloads/zenplus-appliance/[0-9.]+/[^/]+\.(ova|ovf|zip|vhdx|vmdk|qcow2|iso|img)$ {
    return 302 /downloads/trial/;
}

# Reached only through X-Accel-Redirect from the trial_downloads app, after it
# has checked the personal link. nginx sends the file itself, so resumed and
# ranged downloads work and no application worker is held for the transfer.
location /_protected/zenplus-appliance/ {
    internal;
    alias /home/net/appliance-releases/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
}

# The release page is rendered by the website (same header, footer and style
# as every other page) instead of the stand-alone index.html in the directory.
# Checksums, signatures, the public key and the release records stay static
# and public: people need them to verify a download.
location ~ ^/downloads/zenplus-appliance/([0-9]+\.[0-9]+\.[0-9]+/)?$ {
    # Same directives as `location /`, for example:
    # proxy_pass http://unix:/run/zentryc.sock;
    # proxy_set_header Host $host;
    # proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

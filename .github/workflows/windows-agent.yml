name: Windows agent release

# Azure Artifact Signing Configuration
# =====================================
# This workflow signs Windows binaries using Azure Artifact Signing (Public Trust).
# The following GitHub secrets and variables must be configured:
#
# Required Secrets (Settings > Secrets and variables > Actions > Secrets):
#   AZURE_CLIENT_ID       - App registration client ID with federated credential
#   AZURE_TENANT_ID       - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription containing the Artifact Signing account
#
# Required Variables (Settings > Secrets and variables > Actions > Variables):
#   ZENPLUS_ARTIFACT_SIGNING_ENDPOINT - Regional endpoint (e.g., https://eus.codesigning.azure.net)
#   ZENPLUS_ARTIFACT_SIGNING_ACCOUNT  - Artifact Signing account name
#   ZENPLUS_ARTIFACT_SIGNING_PROFILE  - Certificate profile name (Public Trust)
#
# Azure Setup (one-time):
# 1. Create Artifact Signing account (Basic SKU) in Azure Portal
# 2. Complete Public Trust organization identity validation as "Zentryc"
# 3. Create Public Trust certificate profile
# 4. Create App Registration with federated credential for GitHub Actions OIDC:
#    - Subject: repo:khuram2025/zen-mon:ref:refs/heads/main (or environment/branch)
# 5. Grant "Artifact Signing Certificate Profile Signer" role to the App Registration

on:
  push:
    paths:
      - "ZenPlus_Agent/**"
      - "server/app/api/v1/agents.py"
      - "server/app/api/v1/servers.py"
      - "scripts/build-release.py"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ZenPlus_Agent/go.mod
          cache-dependency-path: ZenPlus_Agent/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Require Azure Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) { $missing += "AZURE_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) { $missing += "AZURE_TENANT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) { $missing += "AZURE_SUBSCRIPTION_ID" }
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_SIGNING_ENDPOINT)) { $missing += "ZENPLUS_ARTIFACT_SIGNING_ENDPOINT" }
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_SIGNING_ACCOUNT)) { $missing += "ZENPLUS_ARTIFACT_SIGNING_ACCOUNT" }
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_SIGNING_PROFILE)) { $missing += "ZENPLUS_ARTIFACT_SIGNING_PROFILE" }
          if ($missing.Count -gt 0) {
            throw "Production agent builds require Azure Artifact Signing. Missing: $($missing -join ', '). See workflow comments for setup instructions."
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and test immutable x64 release
        shell: pwsh
        working-directory: ZenPlus_Agent
        env:
          ZENPLUS_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_ENDPOINT }}
          ZENPLUS_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_ACCOUNT }}
          ZENPLUS_ARTIFACT_SIGNING_PROFILE: ${{ vars.ZENPLUS_ARTIFACT_SIGNING_PROFILE }}
          ZENPLUS_REQUIRED_SIGNER_SUBJECT: "Zentryc"
        run: |
          $python = (Get-Command python).Source
          $env:ZENPLUS_BUILD_PYTHON = $python
          ./scripts/build.ps1 -RequireSigning

      - name: Verify release outputs
        shell: pwsh
        working-directory: ZenPlus_Agent
        run: |
          $manifest = Get-Content ./dist/agent-manifest.json -Raw | ConvertFrom-Json
          $setup = Get-Item (Join-Path ./dist $manifest.file_name)
          if ($setup.Length -ne $manifest.size_bytes) {
            throw "Setup size does not match agent-manifest.json"
          }
          $sha = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          if ($sha -ne $manifest.sha256) {
            throw "Setup SHA-256 does not match agent-manifest.json"
          }
          if ($setup.Name -ne "zenplus-agent-$($manifest.version).exe") {
            throw "Setup filename/version mismatch"
          }
          $msi = Get-Item (Join-Path ./dist $manifest.msi_file_name)
          if ((Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant() -ne $manifest.msi_sha256) {
            throw "MSI SHA-256 does not match agent-manifest.json"
          }
          $requiredSubject = "Zentryc"
          foreach ($package in @($msi, $setup)) {
            $signature = Get-AuthenticodeSignature $package.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($package.Name) is not Authenticode trusted: $($signature.Status)"
            }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -notmatch [regex]::Escape($requiredSubject)) {
              throw "$($package.Name) signer subject '$subject' does not contain '$requiredSubject'. Production builds must be signed as Zentryc, not a personal name."
            }
            Write-Host "$($package.Name): Valid signature, subject contains '$requiredSubject'"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: zenplus-agent-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            ZenPlus_Agent/dist/zenplus-agent-*.msi
            ZenPlus_Agent/dist/zenplus-agent-*.exe
            ZenPlus_Agent/dist/agent-manifest.json

      - name: Attach Windows packages to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload $env:RELEASE_TAG
          ZenPlus_Agent/dist/zenplus-agent-*.msi
          ZenPlus_Agent/dist/zenplus-agent-*.exe
          ZenPlus_Agent/dist/agent-manifest.json
          --clobber

  publish-to-portal:
    # Agent-source commits publish the rebuilt package when auto-publishing is
    # explicitly enabled. Otherwise the signed build artifact remains
    # available for a controlled/manual release path.
    if: >-
      vars.ZENPLUS_AGENT_AUTO_PUBLISH == 'true' &&
      (github.event_name == 'push' || github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch')
    needs: build-msi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zenplus-agent-windows
          path: agent-artifact

      - name: Configure deployment key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZENPLUS_AGENT_SSH_PRIVATE_KEY }}
          ZENPLUS_AGENT_HOST: ${{ vars.ZENPLUS_AGENT_HOST }}
          ZENPLUS_AGENT_USER: ${{ vars.ZENPLUS_AGENT_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$ZENPLUS_AGENT_HOST"
          test -n "$ZENPLUS_AGENT_USER"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/zenplus-agent-release
          chmod 0600 ~/.ssh/zenplus-agent-release
          ssh-keyscan -H "$ZENPLUS_AGENT_HOST" >> ~/.ssh/known_hosts

      - name: Publish MSI to portal artifact store
        shell: bash
        env:
          ZENPLUS_AGENT_HOST: ${{ vars.ZENPLUS_AGENT_HOST }}
          ZENPLUS_AGENT_USER: ${{ vars.ZENPLUS_AGENT_USER }}
        run: |
          set -euo pipefail
          msi="$(find agent-artifact -maxdepth 1 -type f -name 'zenplus-agent-*.msi' -print -quit)"
          test -n "$msi"
          name="$(basename "$msi")"
          sha="$(sha256sum "$msi" | awk '{print $1}')"
          incoming="/tmp/${name}.${sha}.incoming"
          scp -i ~/.ssh/zenplus-agent-release "$msi" \
            "$ZENPLUS_AGENT_USER@$ZENPLUS_AGENT_HOST:$incoming"
          ssh -i ~/.ssh/zenplus-agent-release \
            "$ZENPLUS_AGENT_USER@$ZENPLUS_AGENT_HOST" \
            bash -s -- "$name" "$sha" <<'REMOTE'
          set -euo pipefail
          name="$1"
          expected_sha="$2"
          incoming="/tmp/${name}.${expected_sha}.incoming"
          destination="/opt/zenplus/artifacts/agents/windows/${name}"
          trap 'rm -f -- "$incoming"' EXIT

          [[ "$name" =~ ^zenplus-agent-[0-9]+\.[0-9]+\.[0-9]+\.msi$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          install -d -m 0755 /opt/zenplus/artifacts/agents/windows

          if [[ -e "$destination" ]]; then
            existing_sha="$(sha256sum "$destination" | awk '{print $1}')"
            if [[ "$existing_sha" != "$expected_sha" ]]; then
              echo "Refusing to replace immutable package $name ($existing_sha != $expected_sha). Bump AgentVersion and publish a new filename." >&2
              exit 1
            fi
          else
            install -m 0644 "$incoming" "$destination"
          fi

          actual_sha="$(sha256sum "$destination" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]]
          REMOTE

  publish-to-zentryc:
    if: >-
      vars.ZENPLUS_AGENT_AUTO_PUBLISH == 'true' &&
      (github.event_name == 'push' || github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch')
    needs: build-msi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zenplus-agent-windows
          path: agent-artifact

      - name: Configure public release key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZENTRYC_AGENT_RELEASE_SSH_PRIVATE_KEY }}
          RELEASE_HOST: ${{ vars.ZENTRYC_AGENT_RELEASE_HOST }}
          RELEASE_USER: ${{ vars.ZENTRYC_AGENT_RELEASE_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$RELEASE_HOST"
          test -n "$RELEASE_USER"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/zentryc-agent-release
          chmod 0600 ~/.ssh/zentryc-agent-release
          ssh-keyscan -H "$RELEASE_HOST" >> ~/.ssh/known_hosts

      - name: Publish signed MSI, EXE, and manifest atomically
        shell: bash
        env:
          RELEASE_HOST: ${{ vars.ZENTRYC_AGENT_RELEASE_HOST }}
          RELEASE_USER: ${{ vars.ZENTRYC_AGENT_RELEASE_USER }}
        run: |
          set -euo pipefail
          manifest="agent-artifact/agent-manifest.json"
          msi="agent-artifact/$(jq -r .msi_file_name "$manifest")"
          setup="agent-artifact/$(jq -r .file_name "$manifest")"
          test "$(jq -r .signature_status "$manifest")" = "Valid"
          test "$(jq -r .msi_signature_status "$manifest")" = "Valid"
          remote_root="agent-releases/stable"
          ssh -i ~/.ssh/zentryc-agent-release "$RELEASE_USER@$RELEASE_HOST" \
            "install -d -m 0755 '$remote_root'"
          msi_name="$(basename "$msi")"
          setup_name="$(basename "$setup")"
          scp -i ~/.ssh/zentryc-agent-release "$msi" \
            "$RELEASE_USER@$RELEASE_HOST:$remote_root/$msi_name.incoming"
          scp -i ~/.ssh/zentryc-agent-release "$setup" \
            "$RELEASE_USER@$RELEASE_HOST:$remote_root/$setup_name.incoming"
          scp -i ~/.ssh/zentryc-agent-release "$manifest" \
            "$RELEASE_USER@$RELEASE_HOST:$remote_root/manifest.json.incoming"
          ssh -i ~/.ssh/zentryc-agent-release "$RELEASE_USER@$RELEASE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd agent-releases/stable
          msi="$(jq -r .msi_file_name manifest.json.incoming)"
          setup="$(jq -r .file_name manifest.json.incoming)"
          msi_sha="$(jq -r .msi_sha256 manifest.json.incoming)"
          setup_sha="$(jq -r .sha256 manifest.json.incoming)"
          trap 'rm -f -- "$msi.incoming" "$setup.incoming" manifest.json.incoming' EXIT
          test "$(sha256sum "$msi.incoming" | awk '{print $1}')" = "$msi_sha"
          test "$(sha256sum "$setup.incoming" | awk '{print $1}')" = "$setup_sha"
          if test -e "$msi"; then
            test "$(sha256sum "$msi" | awk '{print $1}')" = "$msi_sha"
          else
            mv "$msi.incoming" "$msi"
          fi
          if test -e "$setup"; then
            test "$(sha256sum "$setup" | awk '{print $1}')" = "$setup_sha"
          else
            mv "$setup.incoming" "$setup"
          fi
          chmod 0644 "$msi" "$setup" manifest.json.incoming
          ln -sfn "$msi" ZenPlusAgent-latest.msi
          ln -sfn "$setup" ZenPlusAgentSetup-latest.exe
          mv -f manifest.json.incoming manifest.json
          REMOTE

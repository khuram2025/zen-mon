# ZenPlus — Production docker-compose
# Only ClickHouse runs in Docker; PostgreSQL & Redis are native host services.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: zenplus-clickhouse
    environment:
      CLICKHOUSE_DB: zenplus
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - /data/clickhouse:/var/lib/clickhouse
      - /data/backups/clickhouse:/backups
      - ./docker/clickhouse/backup_disk.xml:/etc/clickhouse-server/config.d/backup_disk.xml:ro
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse_dev}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: zenplus_clickhouse
    ipam:
      config:
        - subnet: 198.120.20.64/28
          gateway: 198.120.20.65

# Included in the zentryc.com server block.
location = /downloads/zenplus-agent {
    return 301 /downloads/zenplus-agent/;
}

location = /downloads/zenplus-agent/stable/manifest.json {
    alias /home/net/agent-releases/stable/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /downloads/zenplus-agent/ {
    alias /home/net/agent-releases/;
    index index.html;
    autoindex off;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
